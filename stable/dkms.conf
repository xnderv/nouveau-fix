# nouveau for GeForce GTX 560 Ti (GF114) with full reclocking — rebuilt by DKMS for every new kernel.
# Source of the driver: upstream Linux matching the running kernel, fetched by prepare.sh, plus patches/.
PACKAGE_NAME="nouveau-gf114"
PACKAGE_VERSION="1.0"
PRE_BUILD="prepare.sh ${kernelver}"
MAKE[0]="make -C /lib/modules/${kernelver}/build M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/nouveau modules"
CLEAN="rm -rf nouveau"
BUILT_MODULE_NAME[0]="nouveau"
BUILT_MODULE_LOCATION[0]="nouveau/"
DEST_MODULE_LOCATION[0]="/updates/nouveau-gf114"
AUTOINSTALL="yes"
